plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.onetake.captions'
version = '0.1.0'

def moonshineCache = rootProject.file('../tools/.cache/moonshine')
def acousticFillerCache = rootProject.file('../tools/.cache/acoustic-fillers/assets')
def moonshineAar = file('libs/moonshine-voice-0.1.5-java.aar')

android {
  namespace 'com.onetake.captions'
  ndkVersion rootProject.ext.ndkVersion

  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    // The native engine is capability-gated at API 26 at runtime. Keeping the
    // library manifest's minimum lower avoids forcing the whole app to API 26.
    minSdkVersion 24
    consumerProguardFiles 'proguard-rules.pro'
    externalNativeBuild {
      cmake {
        cppFlags '-std=c++17 -fexceptions -frtti'
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }

  packagingOptions {
    jniLibs {
      // The rebuilt libraries are loaded from the APK's native library path.
      // Keep their bytes intact so the staged SHA-256 values remain verifiable.
      useLegacyPackaging true
      keepDebugSymbols += [
        '**/libmoonshine-jni.so',
        '**/libmoonshine.so',
        '**/libonnxruntime.so',
      ]
    }
  }

  sourceSets {
    main {
      assets.srcDir moonshineCache.toPath().resolve('assets')
      jniLibs.srcDir moonshineCache.toPath().resolve('jniLibs')
    }
    // The Uhm weights are intentionally available only to debuggable builds.
    // The directory is a local staging cache and is never committed or fetched
    // by Gradle.
    debug {
      assets.srcDir rootProject.file('../tools/.cache/acoustic-fillers/assets')
    }
  }

  externalNativeBuild {
    cmake {
      path file('src/main/cpp/CMakeLists.txt')
    }
  }
}

tasks.configureEach { task ->
  if (task.name.startsWith('merge') || task.name.startsWith('package')) {
    task.doFirst {
      def required = [
        moonshineCache.toPath().resolve('assets/moonshine-tiny/streaming_config.json').toFile(),
        moonshineCache.toPath().resolve('jniLibs/arm64-v8a/libmoonshine-jni.so').toFile(),
        moonshineCache.toPath().resolve('jniLibs/arm64-v8a/libmoonshine.so').toFile(),
        moonshineCache.toPath().resolve('jniLibs/arm64-v8a/libonnxruntime.so').toFile(),
      ]
      if (!moonshineAar.isFile() || required.any { !it.isFile() }) {
        throw new GradleException(
          'Moonshine is not staged. Run python3 tools/prepare_moonshine.py '
            + '--native-dir /path/to/rebuilt/arm64-v8a before building.'
        )
      }
      def acousticModel = acousticFillerCache.toPath().resolve('uhm-web-fp16.onnx').toFile()
      def acousticLicense = acousticFillerCache.toPath().resolve('DESERT-ANT-LICENSE.txt').toFile()
      def acousticNotice = acousticFillerCache.toPath().resolve('DESERT-ANT-NOTICE.txt').toFile()
      if (task.name.toLowerCase().contains('debug') && acousticModel.isFile() &&
          (!acousticLicense.isFile() || !acousticNotice.isFile())) {
        throw new GradleException(
          'The staged Uhm model requires DESERT-ANT-LICENSE.txt and '
            + 'DESERT-ANT-NOTICE.txt in tools/.cache/acoustic-fillers/assets.'
        )
      }
    }
  }
}

dependencies {
  // This AAR is generated by prepare_moonshine.py after removing the stock
  // native libraries. The consuming app therefore sees exactly one runtime.
  implementation files(moonshineAar)
  implementation 'androidx.appcompat:appcompat:1.6.1'
  implementation 'com.google.android.material:material:1.10.0'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'androidx.work:work-runtime:2.9.1'
  testImplementation 'junit:junit:4.13.2'
}
