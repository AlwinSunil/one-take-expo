<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Composition research · real photo crop pairs</title>
<style>body{background:#101214;color:#f6f6f6;font:17px/1.5 system-ui;max-width:760px;margin:auto;padding:24px}p{color:#c6ccd1}button{font:inherit;padding:14px 20px;border-radius:12px;border:1px solid #9da6ac;background:#242a30;color:white;min-height:48px}article{padding:18px 0;border-top:1px solid #586068}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}svg{width:100%;height:250px;background:#252a30}a{color:#9dd9ff}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin:16px 0}input{width:24px;height:24px;vertical-align:middle}h1{font-size:28px}h2{font-size:21px}</style>
<h1>Real photo crop pairs</h1>
<p>Research only. Original public-license photographs shown through two viewports. The rule uses manually marked regions; no face detector, camera stream or NPU runs. Two held-out photographs remain hidden.</p>
<label><input type="checkbox" id="intent"> Intentional crop — suppress advice</label>
<button id="run">Run crop feasibility checks</button>
<p id="status" role="status">Not run.</p><main id="pairs"></main><pre id="output"></pre>
<script>
const full=[0,0,1,1];let corpus;
const clipped=(region,crop)=>region[0]<crop[0]||region[1]<crop[1]||region[0]+region[2]>crop[0]+crop[2]||region[1]+region[3]>crop[1]+crop[3];
const advise=(s,crop,intent)=>intent?null:clipped(s.region,crop)?s.cue:null;
function viewport(s,crop){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',crop.map((v,i)=>v*s.dimensions[i%2]).join(' '));svg.setAttribute('preserveAspectRatio','xMidYMid meet');const image=document.createElementNS(svg.namespaceURI,'image');image.setAttribute('href',s.localFile);image.setAttribute('width',String(s.dimensions[0]));image.setAttribute('height',String(s.dimensions[1]));image.setAttribute('preserveAspectRatio','none');const clip=document.createElementNS(svg.namespaceURI,'clipPath');clip.id='crop-'+s.id+'-'+crop[0];const rect=document.createElementNS(svg.namespaceURI,'rect');for(const [i,key] of ['x','y','width','height'].entries())rect.setAttribute(key,String(crop[i]*s.dimensions[i%2]));clip.append(rect);svg.append(clip);image.setAttribute('clip-path','url(#'+clip.id+')');svg.append(image);return svg;}
fetch('corpus.json').then(r=>{if(!r.ok)throw Error('Manifest unavailable');return r.json()}).then(data=>{corpus=data;for(const s of data.sources.filter(s=>s.split==='development')){const article=document.createElement('article');const heading=document.createElement('h2');heading.textContent=s.id;article.append(heading);const desc=document.createElement('p');desc.textContent=s.scene;article.append(desc);const pair=document.createElement('div');pair.className='pair';for(const [name,crop] of [['Full source',full],['Deliberate clipped viewport',s.crop]]){const cell=document.createElement('div');const caption=document.createElement('p');caption.textContent=name;cell.append(viewport(s,crop),caption);pair.append(cell)}article.append(pair);const credit=document.createElement('a');credit.href=s.source;credit.textContent=s.author+' · '+s.license+' · source and attribution';article.append(credit);document.querySelector('#pairs').append(article)}}).catch(e=>document.querySelector('#status').textContent=e.message);
document.querySelector('#run').onclick=()=>{if(!corpus)return;const intent=document.querySelector('#intent').checked;const results=corpus.sources.filter(s=>s.split==='development').map(s=>({source:s.id,full:advise(s,full,intent),clipped:advise(s,s.crop,intent),expectedClipped:intent?null:s.cue,passed:advise(s,full,intent)===null&&advise(s,s.crop,intent)===(intent?null:s.cue)}));const record={time:new Date().toISOString(),userAgent:navigator.userAgent,intentionalCrop:intent,method:'manual-region rectangle containment; no inference',independentSources:3,heldOutSourcesUsed:0,results};document.querySelector('#status').textContent=results.filter(r=>r.passed).length+' / 3 source-pair checks passed';document.querySelector('#output').textContent=JSON.stringify(record,null,2);};
</script></html>
